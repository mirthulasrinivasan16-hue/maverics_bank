<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Bootstrap 5 -->

<!-- Bootstrap Icons -->

    <style>
        body{

            background:linear-gradient(
                135deg,
                #0d6efd,
                #0b5ed7,

        .login-card{

        .bank-logo i{
            font-size:40px;
            color:#0d6efd;
        }

        .login-title{
            font-weight:700;
            text-align:center;
            margin-bottom:5px;
        }

        .login-subtitle{
            text-align:center;
            color:#6c757d;

            background:#f8f9fa;
        }

<body>

<div class="login-card">

    <!-- Logo -->
    <div class="bank-logo">
        <i class="bi bi-bank2"></i>
    </div>

    <!-- Heading -->
    <h2 class="login-title">
        Maverics Bank
    </h2>

    <p class="login-subtitle">
        Secure Banking Management System
    </p>

    <!-- Login Form -->
    <form>

        <!-- Username -->
        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-person-fill"></i>
                </span>

                <input type="text"
                       class="form-control"
                       placeholder="Enter username">

            </div>

        </div>

        <!-- Password -->
        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-lock-fill"></i>
                </span>

                <input type="password"
                       class="form-control"
                       placeholder="Enter password">

            </div>

        </div>

        <!-- Remember -->
        <div class="d-flex justify-content-between mb-4">

            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       id="remember">

                <label class="form-check-label"
                       for="remember">
                    Remember Me
                </label>
            </div>

            <a href="#">
                Forgot Password?
            </a>

        </div>

        <!-- Login Button -->
        <button type="submit"
                class="btn btn-login w-100">

            <i class="bi bi-box-arrow-in-right me-2"></i>
            Login

        </button>

    </form>

    <!-- Register -->
    <div class="footer-text">

        Don't have an account?

        <a href="#">
            Register
        </a>

    </div>

</div>

<script src="js/main.js"></script>
<script src="js/validation.js"></script>

</body>
